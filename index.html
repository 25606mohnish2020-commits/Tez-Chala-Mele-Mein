<!DOCTYPE html>
<!-- ============================================================================
     तेज़ चला मेले में — the front door.

     Opening this folder used to land on the server's own list of what is in it,
     "story" and "TCMM My Dev Game", and a child had to pick one. There is only
     ever one way in: the book, on its title page, waiting for कहानी चलाओ. The
     game is not a second entrance — it is where the book ends, reached through
     आगे on Page 18, and it has to be at the root's own level for the book to
     reach it, which is the only reason it was ever visible here.

     So this hands straight over to the book. Nothing about either the story or
     the game changes: both stay exactly where they are, and this only decides
     what an unqualified visit to this folder means.

     replace() rather than an assignment, so this page is not left in the
     history behind the book — Back from the title page goes wherever the
     child came from, not into a loop through here. It runs in the head, before
     the body has anything to paint, so it is not a screen that is seen; the
     colours below are the book's own paper, for the moment on a slow disk
     before the handover lands and for anyone arriving with JavaScript off, who
     gets the same thing through the refresh and the link.
     ========================================================================= -->

<title>तेज़ चला मेले में · Tez Chala Mele Mein</title>

<script>location.replace("story/index.html" + location.search + location.hash);</script>

<!-- the cover starts loading from here, so the book opens on a picture that is
     already decoded rather than on an empty frame -->
<link rel="preload" as="image" href="story/assets/images/Cover%20Page.png" />

</style>
